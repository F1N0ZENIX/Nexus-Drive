name: Nexus validation (no release)
on:
  push:
    branches: [nexus-folder-appearance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests
        run: ./gradlew :android:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :android:assembleDebug -PsplitAbis=false
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-debug
          path: android/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error
  compatibility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Local storage, sync and crypto tests
        run: ./gradlew :shared:desktopTest
